name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: Node 20 left maintenance in April 2026, and pg-boss (the
          # scheduler's durable queue, T2.6) requires >=22.12. The floor is
          # declared in package.json engines and this must not drift from it.
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate. typecheck + lint (incl. the process.env/no-any/no-TODO rules)
      # + arch (the import wall) + test (unit + the architecture-as-test).
      # No rule here can be skipped by a reviewer under deadline.
      - run: npm run check
